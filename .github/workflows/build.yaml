---
name: Build Calendar

permissions:
  contents: write

"on":
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

jobs:
  check-config:
    name: Check calendar configuration
    runs-on: ubuntu-latest

    outputs:
      has_config: ${{ steps.check.outputs.has_config }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for calendars.yaml
        id: check
        run: |
          if [ -f "calendars.yaml" ]; then
            echo "calendars.yaml found"
            echo "has_config=true" >> "$GITHUB_OUTPUT"
          else
            echo "calendars.yaml not found - skipping build"
            echo "has_config=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Calendar
    needs: check-config
    if: needs.check-config.outputs.has_config == 'true'
    uses: paulte/calmerge/.github/workflows/build-calendar.yml@055b0a3a69a91360252864154042543c376f5be7 # main
