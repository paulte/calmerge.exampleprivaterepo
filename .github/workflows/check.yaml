---
name: Check Configuration

permissions:
  contents: read

"on":
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  check-config:
    name: Check calendar configuration
    runs-on: ubuntu-latest

    outputs:
      has_config: ${{ steps.check.outputs.has_config }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for calendars.yaml
        id: check
        run: |
          if [ -f "calendars.yaml" ]; then
            echo "calendars.yaml found"
            echo "has_config=true" >> "$GITHUB_OUTPUT"
          else
            echo "calendars.yaml not found - skipping check"
            echo "has_config=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: check-config
    if: needs.check-config.outputs.has_config == 'true'
    uses: paulte/calmerge/.github/workflows/check-configuration.yml@eda9fc448ea076cf57845c1ca22aae43ca76849d # main
